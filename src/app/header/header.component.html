<div class="header">
  <div class="menu-btn">
    <button style="float: left;" mat-icon-button (click)="toggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <span *ngIf="isSuperAdmin" class="welcome-message">Welcome to Super Admin</span>
    <span *ngIf="!isSuperAdmin">Dashboard</span>
  </div>
  <div class="header-actions">
    <button
      mat-icon-button
      class="theme-toggle"
      (click)="toggleTheme()"
      [matTooltip]="themeTooltip"
      aria-label="Toggle theme"
    >
      <mat-icon>{{ themeMode === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <div class="user-info" *ngIf="username">
      <mat-icon class="user-icon">account_circle</mat-icon>
      <span class="username-text">{{ username }}</span>
    </div>
  </div>
</div>
